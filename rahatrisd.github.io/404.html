<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not indexed — Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#EEF1EF;--ink:#0B1614;--muted:#6B7A76;--accent:#0E8A66;--line:#CFD8D4;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0A1412;--ink:#E8F0ED;--muted:#8B9A95;--accent:#3BE0A6;--line:#22342F}
}
:root[data-theme="dark"]{--bg:#0A1412;--ink:#E8F0ED;--muted:#8B9A95;--accent:#3BE0A6;--line:#22342F}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.6;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{max-width:46ch;display:flex;flex-direction:column;gap:16px}
.code{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"Sora",system-ui,sans-serif;font-weight:700;font-size:clamp(28px,6vw,44px);letter-spacing:-.03em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:180px}
.meter i{display:block;height:100%;width:4%;background:var(--accent)}
.row{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);padding-top:14px;border-top:1px solid var(--line)}
a.back{
  align-self:flex-start;margin-top:6px;text-decoration:none;font-weight:600;font-size:14px;
  padding:10px 18px;border-radius:999px;background:var(--accent);color:#04100C;
}
</style>
</head>
<body>
  <main class="card">
    <span class="code">404 — not in the index</span>
    <h1>That page isn't in the library.</h1>
    <p>Atlas only returns what it has actually read. This path was never indexed, so there's nothing to cite — rather than guess at it, here's the way back.</p>
    <div class="row">
      <span>Retrieval confidence</span>
      <span class="meter"><i></i></span>
      <span style="font-family:'IBM Plex Mono',monospace">4%</span>
    </div>
    <a class="back" href="/">Back to Atlas</a>
  </main>
</body>
</html>
